<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixLink Admin Control | Sign In</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

  <main class="login-card">
    <div class="login-brand">
      <div class="brand-mark">F</div>
      <h1>FixLink <span>Admin Control</span></h1>
      <p>Authorized administrators only</p>
    </div>

    <div class="login-form">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="admin@example.com" autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">

      <button type="button" id="signInBtn">Sign In</button>
      <p class="login-message" id="loginMessage"></p>
    </div>

    <p class="login-footer">Protected area. All activity may be logged.</p>
  </main>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script> 
</body>
</html>
